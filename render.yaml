services:
  - type: web
    name: servicenow-rag-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_API_KEY
        sync: false # set in the Render dashboard
      - key: FRONTEND_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: SEED_SAMPLES_IF_EMPTY
        value: "true"
      - key: ANSWER_MODE
        value: auto
